<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · 企业知识库智能问答</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563EB'/%3E%3Cpath d='M31 25.5c-3.6-2.6-8-3.9-13-3.9v21c5 0 9.4 1.3 13 3.9z' fill='%23fff'/%3E%3Cpath d='M33 25.5c3.6-2.6 8-3.9 13-3.9v21c-5 0-9.4 1.3-13 3.9z' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root{
    --radius: 6px;
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --line: #E5E7EB;
    --line-strong: #D1D5DB;
    --text: #111827;
    --text-2: #4B5563;
    --text-3: #6B7280;
    --brand: #2563EB;
    --brand-strong: #1D4ED8;
    --brand-weak: rgba(37,99,235,.08);
    --brand-line: rgba(37,99,235,.35);
    --err: #B91C1C;                       /* 语义错误色，与品牌蓝区分 */
    --shadow-sm: 0 1px 2px rgba(17,24,39,.04);
    --shadow-md: 0 6px 24px rgba(17,24,39,.08);
    --shadow-lg: 0 12px 40px rgba(17,24,39,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font:14px/1.7 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    width:100%;max-width:400px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow-lg);padding:36px 36px 32px;
  }
  .logo{
    width:64px;height:64px;margin:0 auto 16px;border-radius:14px;
    overflow:hidden;background:var(--surface);
    border:1px solid var(--line);box-shadow:var(--shadow-sm);
    display:flex;align-items:center;justify-content:center;
  }
  .logo img,.logo svg{width:100%;height:100%;object-fit:contain;display:block}
  h1{font-size:19px;font-weight:600;margin:0 0 4px;text-align:center}
  .sub{font-size:13px;color:var(--text-3);text-align:center;margin:0 0 28px}
  label{display:block;font-size:13px;color:var(--text-2);font-weight:500;white-space:nowrap}
  /* 每个字段：标签在左、输入框在右，同一行横排 */
  .field{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .field label{width:44px;flex:0 0 44px;margin:0}
  .field .input-area{flex:1;min-width:0}
  input{
    width:100%;height:42px;padding:0 14px;font-size:14px;color:var(--text);
    border:1px solid var(--line-strong);border-radius:var(--radius);
    background:var(--surface);outline:none;transition:.15s;
  }
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .btn{
    width:100%;height:42px;border:none;border-radius:var(--radius);
    background:var(--brand);color:#fff;font-size:14px;font-weight:500;cursor:pointer;
    transition:.15s;margin-top:6px;
  }
  .btn:hover{background:var(--brand-strong)}
  .btn:disabled{background:var(--brand-line);cursor:default}
  .pw-wrap{position:relative}
  .pw-wrap input{padding-right:44px}
  .pw-toggle{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    border:none;background:none;color:var(--text-3);cursor:pointer;
    padding:6px;border-radius:var(--radius);line-height:0;transition:.15s;
    display:flex;align-items:center;justify-content:center;
  }
  .pw-toggle:hover{color:var(--brand);background:var(--brand-weak)}
  .pw-toggle .eye{display:none}
  .pw-toggle .eye-open{display:block}
  .pw-toggle.show .eye-open{display:none}
  .pw-toggle.show .eye-closed{display:block}
  .err{
    display:none;background:#FDECEC;color:var(--err);border:1px solid #F5C2C2;
    border-radius:var(--radius);padding:9px 12px;font-size:13px;margin:0 0 18px;
  }
  .err.show{display:block}
  .foot{text-align:center;font-size:12px;color:var(--text-3);margin-top:24px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><svg viewBox="0 0 64 64" role="img" aria-label="logo"><rect width="64" height="64" rx="14" fill="#2563EB"/><path d="M31 25.5c-3.6-2.6-8-3.9-13-3.9v21c5 0 9.4 1.3 13 3.9z" fill="#fff"/><path d="M33 25.5c3.6-2.6 8-3.9 13-3.9v21c-5 0-9.4 1.3-13 3.9z" fill="#fff"/></svg></div>
    <h1>企业知识库智能问答</h1>
    <p class="sub">账号由管理员统一发放，不支持注册</p>
    <div class="err" id="err"></div>
    <form id="form" autocomplete="off">
      <div class="field">
        <label for="u">账号</label>
        <div class="input-area">
          <input id="u" name="username" type="text" placeholder="请输入账号" autocomplete="username" />
        </div>
      </div>
      <div class="field">
        <label for="p">密码</label>
        <div class="input-area">
          <div class="pw-wrap">
            <input id="p" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
            <button class="pw-toggle" id="pw-toggle" type="button" tabindex="-1" aria-label="显示密码">
              <svg class="eye eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye eye-closed" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3l18 18"/>
                <path d="M10.5 5.2A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.2 3.2"/>
                <path d="M6.6 6.6A17.6 17.6 0 0 0 2 12s3.5 7 10 7a9.8 9.8 0 0 0 4.3-1"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <button class="btn" id="btn" type="submit">登录</button>
    </form>
    <p class="foot">账号或密码问题请联系管理员</p>
  </div>

<script>
const $ = s => document.querySelector(s);
const form = $('#form'), err = $('#err'), btn = $('#btn');
const u = $('#u'), p = $('#p'), pwToggle = $('#pw-toggle');

function showErr(msg){
  err.textContent = msg;
  err.classList.add('show');
}

// 密码显隐切换（眼睛图标：隐藏=闭眼+斜杠，显示=睁眼）
pwToggle.addEventListener('click', ()=>{
  const show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  pwToggle.classList.toggle('show', show);
  pwToggle.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
});

form.addEventListener('submit', async e=>{
  e.preventDefault();
  if(!u.value.trim() || !p.value){ showErr('请输入账号和密码'); return; }
  btn.disabled = true;
  err.classList.remove('show');
  try{
    const r = await fetch('/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: u.value.trim(), password: p.value})
    });
    if(r.ok){
      window.location.href = '/';
    } else if(r.status === 401){
      showErr('账号或密码错误');
    } else {
      showErr('登录失败，请稍后重试');
    }
  }catch(err){
    showErr('网络错误，请检查连接');
  }finally{
    btn.disabled = false;
  }
});
</script>
</body>
</html>
